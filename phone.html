<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apollo Chat</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #0d0d0d; color: #fafafa;
    height: 100dvh; display: flex; flex-direction: column;
  }
  header {
    padding: 12px 16px; border-bottom: 1px solid #1d1d1d;
    display: flex; align-items: center; gap: 8px; flex-shrink: 0;
  }
  header .dot { width: 8px; height: 8px; border-radius: 50%; background: #666; }
  header .dot.on { background: #4ade80; }
  header h1 { font-size: 15px; font-weight: 600; }
  header .sub { font-size: 12px; color: #878787; margin-left: auto; }
  main { flex: 1; overflow-y: auto; padding: 16px 12px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 82%; padding: 10px 14px; border-radius: 16px; font-size: 15px; line-height: 1.45; white-space: pre-wrap; word-break: break-word; }
  .me { align-self: flex-end; background: #2563eb; border-bottom-right-radius: 4px; }
  .bot { align-self: flex-start; background: #1d1d1d; border-bottom-left-radius: 4px; }
  .sys { align-self: center; color: #878787; font-size: 12px; padding: 2px 8px; }
  #status { color: #878787; font-size: 13px; padding: 0 16px 6px; min-height: 19px; flex-shrink: 0; }
  form {
    display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    border-top: 1px solid #1d1d1d; flex-shrink: 0;
  }
  input {
    flex: 1; background: #1d1d1d; border: 1px solid #2a2a2a; border-radius: 20px;
    padding: 10px 16px; color: #fafafa; font-size: 16px; outline: none;
  }
  input:focus { border-color: #444; }
  button {
    background: #2563eb; color: #fff; border: 0; border-radius: 20px;
    padding: 0 18px; font-size: 15px; font-weight: 600;
  }
  button:disabled { opacity: .4; }
</style>
</head>
<body>
<header>
  <div class="dot" id="dot"></div>
  <h1>Apollo</h1>
  <div class="sub" id="host"></div>
</header>
<main id="log"></main>
<div id="status"></div>
<form id="form">
  <input id="box" placeholder="说点什么…" autocomplete="off">
  <button id="send" disabled>发送</button>
</form>
<script>
  const params = new URLSearchParams(location.search);
  const token = params.get('token') ?? 'dev-apollo-test';
  const instance = params.get('instance') ?? 'desk';
  const agentHost = params.get('agent') ?? `${location.hostname}:8787`;
  const url = `ws://${agentHost}/agents/apollo/${instance}?token=${encodeURIComponent(token)}`;
  document.getElementById('host').textContent = agentHost;

  const log = document.getElementById('log');
  const box = document.getElementById('box');
  const send = document.getElementById('send');
  const dot = document.getElementById('dot');
  const status = document.getElementById('status');

  function bubble(cls, text) {
    const el = document.createElement('div');
    el.className = `msg ${cls}`;
    el.textContent = text;
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }

  let ws = null;
  let speechChunks = [];

  function connect() {
    ws = new WebSocket(url);
    ws.binaryType = 'arraybuffer';
    ws.onopen = () => {
      dot.classList.add('on');
      send.disabled = false;
      ws.send(JSON.stringify({ type: 'hello', deviceId: 'phone-web', ts: Date.now() }));
    };
    ws.onmessage = (event) => {
      if (typeof event.data !== 'string') {
        speechChunks.push(new Uint8Array(event.data));
        return;
      }
      let m;
      try { m = JSON.parse(event.data); } catch { return; }
      if (m.type === 'ui_state' && m.state === 'thinking' && m.caption) {
        status.textContent = m.caption;
      } else if (m.type === 'timer' && m.durationSeconds) {
        bubble('sys', `⏲ 计时器:${m.durationSeconds}s`);
      } else if (m.type === 'reminder') {
        bubble('sys', `🔔 ${m.message ?? '提醒'}`);
      } else if (m.type === 'error') {
        status.textContent = '';
        bubble('sys', `✗ ${m.message}`);
      } else if (m.type === 'turn_end') {
        status.textContent = '';
        const total = speechChunks.reduce((n, c) => n + c.byteLength, 0);
        if (total > 0) {
          const merged = new Uint8Array(total);
          let off = 0;
          for (const c of speechChunks) { merged.set(c, off); off += c.byteLength; }
          bubble('bot', new TextDecoder().decode(merged));
        }
        speechChunks = [];
      }
    };
    ws.onclose = () => {
      dot.classList.remove('on');
      send.disabled = true;
      status.textContent = '连接断开,3 秒后重连…';
      setTimeout(connect, 3000);
    };
  }
  connect();

  document.getElementById('form').addEventListener('submit', (event) => {
    event.preventDefault();
    const text = box.value.trim();
    if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({ type: 'text_input', text, ts: Date.now() }));
    bubble('me', text);
    box.value = '';
  });
</script>
</body>
</html>
